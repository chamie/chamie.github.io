<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buffer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#111318">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <span id="count">0 заметок</span>
  <div style="display:flex; gap:8px;">
    <button id="permBtn">Разрешения</button>
    <button id="exportBtn">Экспорт JSON</button>
  </div>
</div>

<div id="permPanel" hidden>
  <div class="permRow"><span>📍 Геолокация</span><span class="permStatus" data-perm="geo">—</span></div>
  <div class="permRow"><span>🎙️ Микрофон</span><span class="permStatus" data-perm="mic">—</span></div>
  <div class="permRow"><span>🔔 Уведомления</span><span class="permStatus" data-perm="notif">—</span></div>
  <button id="permRequestAll">Запросить всё</button>
</div>

<div id="capture">
  <textarea id="ta" placeholder="Пиши..." autofocus autocomplete="off" autocapitalize="sentences"></textarea>
  <div id="pending"></div>
  <div id="hint">
    <span>Cmd/Ctrl+Enter или ✓ — сохранить. Enter — просто перенос строки.</span>
    <div id="attachRow">
      <button class="iconbtn" id="btnFile" title="Файл">📎</button>
      <button class="iconbtn" id="btnPhoto" title="Фото/видео">📷</button>
      <button class="iconbtn" id="btnAudio" title="Голос">🎙️</button>
      <button class="iconbtn" id="btnSave" title="Сохранить" style="background:var(--accent);color:#111;">✓</button>
    </div>
  </div>
  <input type="file" id="fileInput" multiple>
  <input type="file" id="photoInput" accept="image/*,video/*" capture="environment">
</div>

<div id="list"><div id="empty">Пока пусто</div></div>

<script src="app.js"></script>
</body>
</html>
